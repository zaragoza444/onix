# Deploy on Render: https://render.com
# Blueprint: New → Blueprint → connect repo with render.yaml at repo root

databases:
  - name: shiva-db
    plan: free
    databaseName: shiva
    user: shiva

services:
  - type: web
    name: shiva-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shiva-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
