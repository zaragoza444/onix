services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onix
      POSTGRES_PASSWORD: onix
      POSTGRES_DB: onix
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port 5433 avoids conflict with local PostgreSQL on 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onix -d onix"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002"
      DATABASE_URL: postgresql://onix:onix@db:5432/onix
      JWT_SECRET: dev-secret-change-in-production
      API_ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
