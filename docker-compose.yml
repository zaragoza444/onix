services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiva
      POSTGRES_PASSWORD: shiva
      POSTGRES_DB: shiva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiva -d shiva"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      DATABASE_URL: postgresql://shiva:shiva@db:5432/shiva
      JWT_SECRET: dev-secret-change-in-production
      API_ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
